[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PDF_FONT_ARIAL_PATH = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
  PDF_FONT_ARIAL_BOLD_PATH = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
  PDF_FONT_CALIBRI_PATH = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

[[plugins]]
  package = "@netlify/plugin-nextjs"
